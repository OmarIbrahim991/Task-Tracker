[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
# Generated Django migration metadata uses mutable class attributes by design.
per-file-ignores = {"tasks/migrations/*.py" = ["RUF012"]}


[tool.ruff.format]
indent-style = "space"
quote-style = "single"
skip-magic-trailing-comma = false
line-ending = "cr-lf"

[tool.black]
line-length = 160
target-version = ['py310']
skip-string-normalization = false
